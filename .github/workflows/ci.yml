name: IRIS Pipeline CI

# Task 4: Trigger on every push and every pull request, across ALL branches.
# No 'branches:' filter is specified below, so this runs regardless of
# which branch the push or PR targets.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dvc dvc-gs pandas scikit-learn joblib pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Pull data and model with DVC
        run: dvc pull

      - name: Run tests
        run: pytest tests/ -v
